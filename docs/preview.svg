<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="-apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 窗口 -->
  <rect x="20" y="20" width="720" height="460" rx="12" fill="url(#win)" stroke="#c9c9c9" filter="url(#sh)"/>

  <!-- 标题栏 -->
  <rect x="20" y="20" width="720" height="40" rx="12" fill="#e7e7e7"/>
  <rect x="20" y="44" width="720" height="16" fill="#e7e7e7"/>
  <circle cx="46" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="40" r="6" fill="#febc2e"/>
  <circle cx="86" cy="40" r="6" fill="#28c840"/>
  <text x="380" y="45" text-anchor="middle" font-size="14" fill="#4a4a4a">偏好设置</text>

  <!-- 工具栏：6 个面板标签 -->
  <g font-size="13" text-anchor="middle">
    <rect x="40"  y="74" width="100" height="30" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="90"  y="94" fill="#333">文件</text>
    <rect x="148" y="74" width="100" height="30" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="198" y="94" fill="#333">项目</text>
    <rect x="256" y="74" width="100" height="30" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="306" y="94" fill="#333">捆绑</text>
    <rect x="364" y="74" width="100" height="30" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="414" y="94" fill="#333">变量</text>
    <!-- 激活态 -->
    <rect x="472" y="74" width="118" height="30" rx="6" fill="#1a73e8"/>
    <text x="531" y="94" fill="#ffffff">软件更新</text>
    <rect x="598" y="74" width="100" height="30" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="648" y="94" fill="#333">终端</text>
  </g>
  <line x1="40" y1="116" x2="700" y2="116" stroke="#d8d8d8"/>

  <!-- 面板内容：软件更新 -->
  <g font-size="14" fill="#222">
    <text x="60" y="156" font-weight="600">软件更新：</text>

    <text x="60" y="200">关注：</text>
    <rect x="130" y="182" width="150" height="26" rx="5" fill="#fff" stroke="#c4c4c4"/>
    <text x="142" y="200" fill="#222">正式版</text>
    <path d="M262 192 l7 7 l7 -7" fill="none" stroke="#666" stroke-width="1.5"/>

    <rect x="60" y="232" width="18" height="18" rx="4" fill="#1a73e8"/>
    <path d="M64 241 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="246">下载更新前先询问</text>

    <text x="60" y="290">上次检查：<tspan fill="#666">35 分钟前</tspan></text>

    <rect x="60" y="312" width="96" height="30" rx="6" fill="#1a73e8"/>
    <text x="108" y="332" text-anchor="middle" fill="#fff" font-size="13">立即检查</text>

    <line x1="60" y1="368" x2="700" y2="368" stroke="#e2e2e2"/>
    <text x="60" y="402" font-weight="600">崩溃报告：</text>
    <rect x="60" y="418" width="18" height="18" rx="4" fill="#1a73e8"/>
    <path d="M64 427 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="432">提交给 MacroMates</text>
    <text x="320" y="432" fill="#666">联系人：</text>
  </g>

  <text x="380" y="486" text-anchor="middle" font-size="11" fill="#9a9a9a">TextMate 2.0.23 · 汉化补丁（零资源版）预览</text>
</svg>
